<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Copenhagen Rental Evaluator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: inputs on the left, one verdict + one chart + one table on the right; stacks with an Inputs/Results switch on phones. */
:root {
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --bg: #f2f1ed; --surface: #fcfcfb; --surface-2: #f5f4f0; --line: #e4e2dc; --line-2: #c9c6be;
  --ink: #161615; --ink-2: #52514e; --ink-3: #6b6a65;
  --accent: #256abf; --accent-hover: #184f95; --on-accent: #ffffff; --accent-soft: #e3eefb;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211; --surface: #1a1a19; --surface-2: #222220; --line: #2d2d2b; --line-2: #46463f;
    --ink: #f4f4f1; --ink-2: #c3c2b7; --ink-3: #9a998f;
    --accent: #3987e5; --accent-hover: #6da7ec; --on-accent: #0b0b0b; --accent-soft: #1d2b3f;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121211; --surface: #1a1a19; --surface-2: #222220; --line: #2d2d2b; --line-2: #46463f;
  --ink: #f4f4f1; --ink-2: #c3c2b7; --ink-3: #9a998f;
  --accent: #3987e5; --accent-hover: #6da7ec; --on-accent: #0b0b0b; --accent-soft: #1d2b3f;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
h1, h2, p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { flex: 1 1 260px; min-width: 0; }
.brand h1 { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
.brand p { color: var(--ink-3); font-size: 12.5px; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.viewtabs { display: none; width: 100%; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 8px; border: 1px solid var(--line); }
.viewtabs button { flex: 1; border: 0; background: transparent; padding: 7px; border-radius: 6px; font-weight: 500; color: var(--ink-2); cursor: pointer; }
.viewtabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 13px; line-height: 1.3; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.danger { color: var(--crit); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn { white-space: nowrap; flex: none; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.sample-note { max-width: 1240px; margin: 0 auto; padding: 0 16px 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--ink-2); font-size: 12.5px; }
.sample-note .pill { background: var(--accent-soft); color: var(--ink); border-radius: 99px; padding: 2px 10px; font-weight: 500; }

/* layout */
.shell { max-width: 1240px; margin: 0 auto; padding: 16px 16px 56px; }
.cols { display: grid; grid-template-columns: minmax(320px, 400px) minmax(0, 1fr); gap: 20px; align-items: start; }
.inputs { position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); max-height: calc(100dvh - 80px); overflow-y: auto; scrollbar-gutter: stable; padding-right: 4px; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.results { min-width: 0; }
@media (max-width: 960px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .inputs { position: static; max-height: none; overflow: visible; padding-right: 0; }
  .viewtabs { display: flex; }
  .shell[data-view="results"] .inputs { display: none; }
  .shell[data-view="inputs"] .results { display: none; }
}
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.card h2 { font-size: 15px; font-weight: 650; }
.card .desc { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
.card-head { margin-bottom: 14px; }
.eyebrow { text-transform: uppercase; letter-spacing: .06em; font-size: 11px; font-weight: 600; color: var(--ink-3); }

/* inputs */
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field > label { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.hint { font-size: 11.5px; color: var(--ink-3); line-height: 1.35; }
.inp { position: relative; display: flex; }
.inp input, select { width: 100%; min-width: 0; height: 34px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); color: var(--ink); }
.inp input[type="number"] { font-variant-numeric: tabular-nums; }
.inp .unit { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-size: 12px; pointer-events: none; }
.inp.has-unit input { padding-right: 40px; }
.inp input:hover, select:hover { border-color: var(--ink-3); }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
details.fine { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
details.fine > summary { cursor: pointer; font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
details.fine .fields { margin-top: 12px; }

.opt-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.opt { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; }
.opt[data-open="true"] { background: var(--surface); border-color: var(--line-2); }
.opt-head { width: 100%; background: transparent; border: 0; cursor: pointer; padding: 10px 12px; display: flex; gap: 10px; align-items: center; text-align: left; }
.opt-head .t { min-width: 0; flex: 1; }
.opt-head .t b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt-head .t span { color: var(--ink-3); font-size: 12px; }
.opt-head .chev { width: 7px; height: 7px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(45deg); flex: none; margin-right: 4px; }
.opt[data-open="true"] .chev { transform: rotate(-135deg); }
.opt-body { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 12px; }
.opt-actions { display: flex; gap: 8px; justify-content: flex-end; }

/* status chips */
.status { --c: var(--good); display: inline-flex; align-items: center; gap: 5px; border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); background: color-mix(in srgb, var(--c) 12%, var(--surface)); color: var(--ink); border-radius: 99px; padding: 1px 9px 1px 7px; font-size: 12px; font-weight: 550; white-space: nowrap; }
.status i { font-style: normal; color: var(--c); font-weight: 800; }
.status.warn { --c: var(--warn); }
.status.bad { --c: var(--crit); }

/* verdict */
.verdict { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 24px; align-items: center; }
.v-name { font-size: 26px; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; margin: 4px 0 6px; overflow-wrap: anywhere; }
.v-line { color: var(--ink-2); display: flex; gap: 8px 10px; flex-wrap: wrap; align-items: center; }
.hero { text-align: right; line-height: 1; }
.hero .n { font-size: 56px; font-weight: 700; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.hero .cap { font-size: 12px; color: var(--ink-3); margin-top: 8px; }
@media (max-width: 560px) { .verdict { grid-template-columns: minmax(0, 1fr); } .hero { text-align: left; } }

/* chart */
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 14px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.hbar { display: grid; grid-template-columns: minmax(84px, 170px) minmax(0, 1fr); column-gap: 14px; row-gap: 14px; position: relative; }
.hb-label { grid-column: 1; align-self: center; min-width: 0; font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb-grid { grid-column: 2; position: relative; pointer-events: none; }
.hb-grid .gl { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.hb-bar { grid-column: 2; display: flex; align-items: center; position: relative; z-index: 1; min-height: 24px; }
.bar { display: flex; gap: 2px; height: 22px; flex: none; }
.bar .seg { height: 100%; min-width: 2px; }
.bar .seg:last-child { border-radius: 0 4px 4px 0; }
.bar .seg:hover, .bar .seg:focus-visible { filter: brightness(1.12); }
.bar-total { margin-left: 8px; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hb-axis { grid-column: 2; position: relative; height: 16px; margin-top: -6px; }
.hb-axis span { position: absolute; font-size: 11px; color: var(--ink-3); transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.hb-axis span:first-child { transform: none; }
.hb-axis span:last-child { transform: translateX(-100%); }
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; box-shadow: 0 6px 20px rgba(0,0,0,.18); font-size: 12.5px; min-width: 150px; max-width: 280px; }
.tip .th { font-weight: 600; margin-bottom: 4px; }
.tip .tr { display: grid; grid-template-columns: 10px auto minmax(0, 1fr); gap: 7px; align-items: center; padding: 1px 0; }
.tip .tr .k { height: 10px; width: 10px; border-radius: 2px; }
.tip .tr strong { font-variant-numeric: tabular-nums; }
.tip .tr .l { color: var(--ink-2); }
.tip .tn { color: var(--ink-3); margin-top: 4px; font-size: 11.5px; }
details.breakdown { margin-top: 14px; }
details.breakdown > summary { cursor: pointer; font-size: 12.5px; color: var(--accent); }

/* tables */
.scroll { overflow-x: auto; max-width: 100%; }
table.tbl { border-collapse: collapse; width: 100%; font-size: 13px; }
.tbl th, .tbl td { padding: 9px 8px; text-align: right; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl thead th { color: var(--ink-2); font-weight: 600; font-size: 12px; border-bottom: 1px solid var(--line-2); vertical-align: bottom; }
.tbl tbody th { font-weight: 600; white-space: normal; min-width: 130px; }
.tbl td.best { font-weight: 650; }
.tbl td.best::before { content: "●"; color: var(--accent); font-size: 8px; margin-right: 6px; vertical-align: 2px; }
.tbl td.neg { color: var(--crit); font-weight: 600; }
.rank { color: var(--ink-3); font-weight: 400; font-size: 12px; margin-right: 6px; }
.chipcell { margin-left: 6px; }

.notes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.notes li { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.notes .status { flex: none; margin-top: 1px; }
.empty { padding: 24px 16px; text-align: center; color: var(--ink-2); }
details.how summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink-2); }
details.how ul { margin: 10px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; color: var(--ink-2); max-width: 78ch; }
.small-note { font-size: 12px; color: var(--ink-3); margin-top: 10px; }
@media (max-width: 560px) { .brand p { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <h1>Copenhagen Rental Evaluator</h1>
      <p>Compare the places that already meet your must-haves on what they really cost you.</p>
    </div>
    <div class="top-actions">
      <button class="btn" id="btn-sample" type="button">Load sample</button>
      <button class="btn" id="btn-clear" type="button">Clear</button>
      <button class="btn" id="btn-theme" type="button" aria-label="Switch between light and dark theme" title="Switch theme">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="viewtabs" role="group" aria-label="Switch view">
      <button type="button" id="tab-inputs" aria-pressed="false">Inputs</button>
      <button type="button" id="tab-results" aria-pressed="true">Results</button>
    </div>
  </div>
  <div class="sample-note" id="sample-note" hidden>
    <span class="pill">Sample data</span>
    <span>Illustrative figures. Replace them with your shortlist.</span>
    <button class="btn ghost sm" id="btn-dismiss-sample" type="button">Dismiss</button>
  </div>
</header>

<div class="shell" id="shell" data-view="results">
  <div class="cols">
    <aside class="inputs" id="inputs" aria-label="Inputs"></aside>
    <main class="results stack" id="results" aria-live="polite"></main>
  </div>
</div>
<div id="tip" class="tip" role="tooltip" hidden></div>

<script>
(function () {
'use strict';

/* ---------- helpers ---------- */
const KEY = 'copenhagen-rental-evaluator-v2';
const THEME_KEY = 'copenhagen-rental-evaluator-theme';
const MAX_OPTIONS = 8;

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (['value', 'checked', 'selected', 'disabled'].includes(k)) e[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
const $ = s => document.querySelector(s);
const uid = () => 'o' + Math.random().toString(36).slice(2, 8);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const nf = new Intl.NumberFormat('en-GB', { maximumFractionDigits: 0 });
const kr = n => (n < 0 ? '−' : '') + nf.format(Math.abs(Math.round(n)));
const krc = n => Math.abs(n) >= 1000 ? (Math.round(n / 100) / 10) + 'k' : String(Math.round(n));
const pct = x => Math.round(x * 100) + '%';
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
const nz = (v, d) => (v !== '' && v !== null && Number.isFinite(+v) ? +v : d);

/* ---------- state ---------- */
function baseProfile() { return { takeHome: 0, otherCosts: 0, stay: 12, days: 4, timePct: 50, furnCost: 18000, notice: 3 }; }
function blankOption() {
  return { id: uid(), name: 'New option', rent: 0, utils: 0, deposit: 0, lease: 12, furnished: true, commuteMin: 20, fare: 0, perks: 0 };
}
function blankState() { const o = blankOption(); o.name = 'Option 1'; return { profile: baseProfile(), options: [o], sample: false }; }
function sampleState() {
  const mk = o => ({ ...blankOption(), ...o });
  return {
    sample: true,
    profile: { ...baseProfile(), takeHome: 38000, otherCosts: 5000 },
    options: [
      mk({ name: 'Nørrebro 2-room', rent: 11500, utils: 1000, deposit: 34500, lease: 0, furnished: false, commuteMin: 18, fare: 60, perks: 230 }),
      mk({ name: 'Østerbro furnished flat', rent: 14800, utils: 0, deposit: 29600, lease: 6, furnished: true, commuteMin: 25, fare: 480, perks: 400 }),
      mk({ name: 'Ørestad new-build with gym', rent: 12900, utils: 1100, deposit: 38700, lease: 12, furnished: false, commuteMin: 22, fare: 500, perks: 580 }),
    ],
  };
}
function normalize(raw) {
  const b = blankState();
  if (!raw || typeof raw !== 'object') return b;
  const P = baseProfile(), rp = raw.profile || {};
  for (const k of Object.keys(P)) P[k] = Math.max(0, nz(rp[k], P[k]));
  P.stay = Math.max(1, P.stay);
  const opts = (Array.isArray(raw.options) && raw.options.length ? raw.options : b.options).slice(0, MAX_OPTIONS).map((r, i) => {
    r = r || {};
    const o = blankOption();
    o.id = String(r.id || o.id).slice(0, 20);
    o.name = String(r.name ?? 'Option ' + (i + 1)).slice(0, 80);
    for (const k of ['rent', 'utils', 'deposit', 'lease', 'commuteMin', 'fare', 'perks']) o[k] = Math.max(0, nz(r[k], o[k]));
    o.furnished = r.furnished !== false;
    return o;
  });
  const seen = new Set(); opts.forEach(o => { while (seen.has(o.id)) o.id += 'x'; seen.add(o.id); });
  return { profile: P, options: opts, sample: !!raw.sample };
}
function load() { try { const t = localStorage.getItem(KEY); if (t) return normalize(JSON.parse(t)); } catch (e) { /* ignore */ } return null; }
let saveTimer = 0;
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }, 250); }

window.addEventListener('pagehide', () => { if (saveTimer) { clearTimeout(saveTimer); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } } });
let S = load() || sampleState();
const ui = { open: S.options[0] && S.options[0].id };

/* ---------- model ---------- */
function compute(o, S) {
  const P = S.profile, income = P.takeHome;
  const stay = Math.max(1, P.stay);
  const commit = o.lease > 0 ? o.lease : P.notice;
  const H = Math.max(stay, commit);
  const housing = o.rent + o.utils;
  const housingNet = Math.max(0, housing - o.perks);
  const furn = o.furnished ? 0 : P.furnCost;
  const setup = furn / H;
  const hours = o.commuteMin * 2 / 60 * P.days * 52 / 12;
  const hourly = income > 0 ? income / (37 * 52 / 12) : 0;
  const time = hours * hourly * P.timePct / 100;
  const commute = o.fare + time;
  const allIn = housingNet + commute + setup;
  const cash = housing + o.fare;
  const share = income > 0 ? housing / income : null;
  const left = income > 0 ? income - P.otherCosts - cash : null;
  let level = 'good', why = '';
  if (share != null) {
    if (left < 0) { level = 'bad'; why = `Monthly costs exceed your take-home by ${kr(-left)} kr.`; }
    else if (share > 0.4) { level = 'bad'; why = `Rent and utilities take ${pct(share)} of take-home, above 40%.`; }
    else if (share > 0.3) { level = 'warn'; why = `Rent and utilities take ${pct(share)} of take-home, above 30%.`; }
  }
  return {
    o, ready: o.rent > 0, housing, housingNet, commute, time, setup, allIn, cash, share, left,
    upfront: o.deposit + furn, commit, H, hours,
    status: { level, why, label: { good: 'Comfortable', warn: 'Stretched', bad: 'Not sustainable' }[level] },
  };
}
function evaluate(S) {
  const list = S.options.map(o => compute(o, S));
  const ranked = list.filter(m => m.ready);
  ranked.sort((a, b) => (a.status.level === 'bad') - (b.status.level === 'bad') || a.allIn - b.allIn);
  ranked.forEach((m, i) => { m.rank = i + 1; });
  return { list, ranked };
}

/* ---------- tooltip ---------- */
const tip = $('#tip');
function showTip(x, y, nodes) {
  tip.replaceChildren(...nodes); tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let left = x + 14, top = y + 14;
  if (left + r.width > innerWidth - 8) left = x - r.width - 14;
  if (top + r.height > innerHeight - 8) top = y - r.height - 14;
  tip.style.left = Math.max(8, left) + 'px'; tip.style.top = Math.max(8, top) + 'px';
}
function hideTip() { tip.hidden = true; }
function bindTip(el, build) {
  el.addEventListener('pointermove', e => showTip(e.clientX, e.clientY, build()));
  el.addEventListener('pointerleave', hideTip);
  el.addEventListener('focus', () => { const r = el.getBoundingClientRect(); showTip(r.left + r.width / 2, r.top, build()); });
  el.addEventListener('blur', hideTip);
}

/* ---------- inputs ---------- */
const inputsEl = $('#inputs');
let rafId = 0;
function changed() { save(); cancelAnimationFrame(rafId); rafId = requestAnimationFrame(() => { renderResults(); updateSummaries(); }); }

function numField(id, label, get, set, o = {}) {
  const inp = h('input', { id, type: 'number', min: 0, step: 'any', inputmode: 'decimal', value: String(get()) });
  inp.addEventListener('input', () => { set(num(inp.value)); changed(); });
  return h('div', { class: 'field' + (o.wide ? ' wide' : '') },
    h('label', { for: id }, label),
    h('div', { class: 'inp' + (o.unit ? ' has-unit' : '') }, inp, o.unit ? h('span', { class: 'unit' }, o.unit) : null),
    o.hint ? h('div', { class: 'hint' }, o.hint) : null);
}
function optionCard(o) {
  const open = ui.open === o.id, f = k => `o-${o.id}-${k}`;
  const card = h('div', { class: 'opt', 'data-open': String(open) },
    h('button', { class: 'opt-head', type: 'button', 'aria-expanded': String(open), onclick: () => { ui.open = open ? null : o.id; renderInputs(); updateSummaries(); } },
      h('span', { class: 't' }, h('b', { 'data-name': o.id }, o.name || 'Untitled'), h('span', { 'data-sum': o.id })),
      h('span', { class: 'chev', 'aria-hidden': 'true' })));
  if (!open) return card;
  const name = h('input', { id: f('name'), type: 'text', maxlength: 80, value: o.name });
  name.addEventListener('input', () => { o.name = name.value; changed(); });
  const furn = h('select', { id: f('furnished') }, h('option', { value: 'yes', selected: o.furnished }, 'Furnished'), h('option', { value: 'no', selected: !o.furnished }, 'Unfurnished'));
  furn.addEventListener('change', () => { o.furnished = furn.value === 'yes'; changed(); });
  card.append(h('div', { class: 'opt-body' },
    h('div', { class: 'fields' },
      h('div', { class: 'field wide' }, h('label', { for: f('name') }, 'Name'), h('div', { class: 'inp' }, name)),
      numField(f('rent'), 'Rent', () => o.rent, v => { o.rent = v; }, { unit: 'kr' }),
      numField(f('utils'), 'Utilities', () => o.utils, v => { o.utils = v; }, { unit: 'kr', hint: 'Heating, water, electricity. 0 if in rent.' }),
      numField(f('deposit'), 'Deposit', () => o.deposit, v => { o.deposit = v; }, { unit: 'kr' }),
      numField(f('lease'), 'Lease length', () => o.lease, v => { o.lease = v; }, { unit: 'mo', hint: '0 if open-ended.' }),
      h('div', { class: 'field' }, h('label', { for: f('furnished') }, 'Furnishing'), furn),
      numField(f('commuteMin'), 'Commute', () => o.commuteMin, v => { o.commuteMin = v; }, { unit: 'min', hint: 'One way.' }),
      numField(f('fare'), 'Transport cost', () => o.fare, v => { o.fare = v; }, { unit: 'kr', hint: 'Per month. 0 if cycling.' }),
      numField(f('perks'), 'Perks included', () => o.perks, v => { o.perks = v; }, { unit: 'kr', hint: 'Gym, internet or laundry you would otherwise pay for, per month.' })),
    h('div', { class: 'opt-actions' },
      h('button', { class: 'btn sm', type: 'button', disabled: S.options.length >= MAX_OPTIONS, onclick: () => { const c = { ...o, id: uid(), name: o.name + ' (copy)' }; S.options.splice(S.options.indexOf(o) + 1, 0, c); ui.open = c.id; refresh(); } }, 'Duplicate'),
      h('button', { class: 'btn sm danger', type: 'button', disabled: S.options.length <= 1, onclick: () => { S.options = S.options.filter(x => x !== o); if (ui.open === o.id) ui.open = null; refresh(); } }, 'Remove'))));
  return card;
}
function refresh() { save(); renderInputs(); renderResults(); updateSummaries(); }

function renderInputs() {
  const keep = inputsEl.scrollTop, P = S.profile;
  const you = h('section', { class: 'card' },
    h('div', { class: 'sec-title' }, h('h2', null, 'Your numbers')),
    h('div', { class: 'fields' },
      numField('p-takeHome', 'Monthly take-home salary', () => P.takeHome, v => { P.takeHome = v; }, { unit: 'kr', wide: true, hint: 'After tax and pension. Used to test whether each option is sustainable.' }),
      numField('p-other', 'Other monthly costs', () => P.otherCosts, v => { P.otherCosts = v; }, { unit: 'kr', hint: 'Food, phone, loans. Optional.' }),
      numField('p-stay', 'Planned stay', () => P.stay, v => { P.stay = Math.max(1, v); }, { unit: 'mo' })),
    h('details', { class: 'fine' }, h('summary', null, 'Fine-tune (optional)'),
      h('div', { class: 'fields' },
        numField('p-days', 'Commute days a week', () => P.days, v => { P.days = clamp(v, 0, 7); }),
        numField('p-time', 'Value of commute time', () => P.timePct, v => { P.timePct = v; }, { unit: '%', hint: 'Share of your hourly take-home.' }),
        numField('p-furn', 'Cost to furnish', () => P.furnCost, v => { P.furnCost = v; }, { unit: 'kr', hint: 'Net of resale. Added to unfurnished options.' }),
        numField('p-notice', 'Notice, open-ended', () => P.notice, v => { P.notice = v; }, { unit: 'mo' }))));
  const opts = h('section', { class: 'card' },
    h('div', { class: 'sec-title' }, h('div', null, h('h2', null, 'Your shortlist'), h('p', { class: 'desc' }, 'Only add places that already meet your must-haves.')),
      h('button', { class: 'btn primary sm', type: 'button', disabled: S.options.length >= MAX_OPTIONS, onclick: () => { const o = blankOption(); o.name = 'Option ' + (S.options.length + 1); S.options.push(o); ui.open = o.id; refresh(); } }, '+ Add')),
    h('div', { class: 'opt-list' }, S.options.map(optionCard)));
  inputsEl.replaceChildren(h('div', { class: 'stack' }, you, opts));
  inputsEl.scrollTop = keep;
}
function updateSummaries() {
  for (const m of evaluate(S).list) {
    const a = inputsEl.querySelector(`[data-sum="${m.o.id}"]`);
    if (a) a.textContent = m.ready ? `${kr(m.allIn)} kr a month all-in` : 'Add the rent to include it';
    const n = inputsEl.querySelector(`[data-name="${m.o.id}"]`);
    if (n) n.textContent = m.o.name || 'Untitled';
  }
}

/* ---------- results ---------- */
const resultsEl = $('#results');
const statusChip = st => h('span', { class: 'status ' + st.level }, h('i', { 'aria-hidden': 'true' }, { good: '✓', warn: '!', bad: '✕' }[st.level]), st.label);
function niceTicks(max, n) {
  if (!(max > 0)) return { ticks: [0, 1], top: 1 };
  const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), nm = raw / mag;
  const step = (nm <= 1 ? 1 : nm <= 2 ? 2 : nm <= 2.5 ? 2.5 : nm <= 5 ? 5 : 10) * mag;
  const top = Math.ceil(max / step - 1e-9) * step, ticks = [];
  for (let v = 0; v <= top + 1e-9; v += step) ticks.push(+v.toFixed(6));
  return { ticks, top };
}
function table(head, rows) {
  return h('div', { class: 'scroll' }, h('table', { class: 'tbl' },
    h('thead', null, h('tr', null, head.map(x => h('th', { scope: 'col' }, x)))),
    h('tbody', null, rows.map(r => h('tr', null, r.map((c, i) => i === 0 ? h('th', { scope: 'row' }, c) : h('td', null, c)))))));
}

function verdictCard(E) {
  const [best, next] = E.ranked;
  const P = S.profile;
  const saving = next ? next.allIn - best.allIn : 0;
  return h('section', { class: 'card verdict' },
    h('div', null,
      h('div', { class: 'eyebrow' }, `Best value for a ${P.stay}-month stay`),
      h('div', { class: 'v-name' }, best.o.name || 'Untitled'),
      h('div', { class: 'v-line' }, best.share != null ? statusChip(best.status) : null,
        best.share != null ? h('span', null, `Rent and utilities are ${pct(best.share)} of your take-home`) : h('span', null, 'Add your take-home salary to check sustainability')),
      next && saving >= 1 ? h('div', { class: 'v-line', style: 'margin-top:4px' }, `${kr(saving)} kr a month less than ${next.o.name}`) : null),
    h('div', { class: 'hero' }, h('div', { class: 'n' }, kr(best.allIn)), h('div', { class: 'cap' }, 'kr a month, all-in')));
}

function chartCard(E) {
  const parts = [
    ['Rent & utilities', 'var(--s1)', m => m.housingNet, 'After subtracting included perks.'],
    ['Commute', 'var(--s2)', m => m.commute, 'Transport cost plus the value of your commute time.'],
    ['Set-up', 'var(--s3)', m => m.setup, 'Furnishing, spread over the months you are committed.'],
  ];
  const { ticks, top } = niceTicks(Math.max(...E.ranked.map(m => m.allIn), 1) * (innerWidth < 560 ? 1.32 : 1.18), innerWidth < 560 ? 3 : 4);
  const root = h('div', { class: 'hbar' });
  E.ranked.forEach((m, i) => {
    root.append(h('div', { class: 'hb-label', style: `grid-row:${i + 1}`, title: m.o.name }, m.o.name || 'Untitled'));
    const bar = h('div', { class: 'bar', style: `width:${clamp(m.allIn / top * 100, 0, 100)}%` },
      parts.filter(p => p[2](m) > 0.5).map(p => {
        const seg = h('div', { class: 'seg', tabindex: '0', style: `flex:${p[2](m)} 1 0;background:${p[1]}`, 'aria-label': `${m.o.name}, ${p[0]}: ${kr(p[2](m))} kr a month` });
        bindTip(seg, () => [h('div', { class: 'th' }, m.o.name), h('div', { class: 'tr' }, h('span', { class: 'k', style: `background:${p[1]}` }), h('strong', null, kr(p[2](m)) + ' kr'), h('span', { class: 'l' }, p[0])), h('div', { class: 'tn' }, p[3])]);
        return seg;
      }));
    root.append(h('div', { class: 'hb-bar', style: `grid-row:${i + 1}` }, bar, h('span', { class: 'bar-total' }, kr(m.allIn))));
  });
  const n = E.ranked.length;
  root.append(h('div', { class: 'hb-grid', style: `grid-row:1 / ${n + 1}` }, ticks.map(t => h('i', { class: 'gl', style: `left:${t / top * 100}%` }))));
  root.append(h('div', { class: 'hb-axis', style: `grid-row:${n + 1}` }, ticks.map(t => h('span', { style: `left:${t / top * 100}%` }, krc(t)))));
  return h('section', { class: 'card' },
    h('div', { class: 'card-head' }, h('h2', null, 'What each option really costs a month'),
      h('p', { class: 'desc' }, 'Rent and utilities less included perks, plus commute (fare and time) and furnishing spread over your commitment.')),
    h('div', { class: 'legend' }, parts.map(p => h('span', null, h('i', { style: `background:${p[1]}` }), p[0]))),
    root,
    h('details', { class: 'breakdown' }, h('summary', null, 'Show as table'),
      table(['Option', ...parts.map(p => p[0]), 'All-in'], E.ranked.map(m => [m.o.name, ...parts.map(p => kr(p[2](m))), kr(m.allIn)]))));
}

function compareCard(E) {
  const bestCost = E.ranked.length > 1 ? Math.min(...E.ranked.map(m => m.allIn)) : null;
  const rows = E.ranked.map(m => h('tr', null,
    h('th', { scope: 'row' }, h('span', { class: 'rank' }, '#' + m.rank), m.o.name || 'Untitled'),
    h('td', { class: m.allIn === bestCost ? 'best' : '' }, kr(m.allIn)),
    h('td', null, m.share != null ? [pct(m.share), h('span', { class: 'chipcell' }, statusChip(m.status))] : '–'),
    h('td', { class: m.left != null && m.left < 0 ? 'neg' : '' }, m.left != null ? kr(m.left) : '–'),
    h('td', null, kr(m.upfront)),
    h('td', null, m.o.lease > 0 ? m.o.lease + ' mo' : 'Open-ended')));
  return h('section', { class: 'card' },
    h('div', { class: 'card-head' }, h('h2', null, 'Side by side'), h('p', { class: 'desc' }, 'Ranked by all-in monthly cost. Options that are not sustainable rank last.')),
    h('div', { class: 'scroll' }, h('table', { class: 'tbl' },
      h('thead', null, h('tr', null, ['Option', 'All-in / mo', 'Housing / take-home', 'Left / mo', 'Move-in cash', 'Lease'].map(x => h('th', { scope: 'col' }, x)))),
      h('tbody', null, rows))),
    h('p', { class: 'small-note' }, 'Housing is rent plus utilities. "Left / mo" is take-home minus housing, transport and your other costs. "Move-in cash" is the deposit plus any furniture you must buy.'));
}

function watchCard(E) {
  const items = [];
  for (const m of E.ranked) {
    const n = m.o.name || 'Untitled';
    if (m.status.level === 'bad') items.push({ level: m.status.level, tag: m.status.level === 'bad' ? 'Problem' : 'Check', text: `${n}: ${m.status.why}` });
    if (m.o.rent > 0 && m.o.deposit > m.o.rent * 3 + 1) items.push({ level: 'warn', tag: 'Check', text: `${n}: the deposit is more than three months' rent. Danish rules generally cap it at three months for ordinary private lets, so check the lease.` });
    if (m.commit > S.profile.stay) items.push({ level: 'warn', tag: 'Check', text: `${n}: you are committed for ${m.commit} months, longer than your ${S.profile.stay}-month stay. Costs are counted for the full period.` });
  }
  if (!items.length) return null;
  const shown = items.slice(0, 4);
  return h('section', { class: 'card' }, h('div', { class: 'card-head' }, h('h2', null, 'Worth a second look')),
    h('ul', { class: 'notes' }, shown.map(it => h('li', null, statusChip({ level: it.level, label: it.tag }), h('span', null, it.text)))),
    items.length > shown.length ? h('p', { class: 'small-note' }, `${items.length - shown.length} more flagged. Open each option to review.`) : null);
}

function howCard() {
  const P = S.profile;
  return h('details', { class: 'card how' }, h('summary', null, 'How this is calculated'),
    h('ul', null,
      h('li', null, 'All-in monthly cost = rent + utilities − included perks + transport + value of commute time + furnishing spread over your commitment.'),
      h('li', null, `Commitment = the longer of your planned stay and the lease length (${P.notice} months notice if open-ended).`),
      h('li', null, `Commute time is valued at ${P.timePct}% of your hourly take-home (salary ÷ 37-hour weeks), for ${P.days} days a week, there and back.`),
      h('li', null, 'The deposit is refundable, so it is shown as move-in cash and not counted as a cost.'),
      h('li', null, 'Sustainability: comfortable up to 30% of take-home on rent and utilities, stretched up to 40%, not sustainable above that or when monthly costs exceed take-home. These are rules of thumb, usually quoted against gross income.')));
}

function renderResults() {
  hideTip();
  const E = evaluate(S);
  if (!E.ranked.length) {
    resultsEl.replaceChildren(h('div', { class: 'card empty' }, 'Enter the rent for at least one option to see the comparison.'));
    return;
  }
  const note = S.profile.takeHome > 0 ? null : h('div', { class: 'card empty' }, 'Add your take-home salary to check each option against your income.');
  resultsEl.replaceChildren(...[verdictCard(E), note, chartCard(E), compareCard(E), watchCard(E), howCard()].filter(Boolean));
}

/* ---------- chrome ---------- */
function applyTheme(t) { if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
try { const t = localStorage.getItem(THEME_KEY); if (t === 'light' || t === 'dark') applyTheme(t); } catch (e) { /* ignore */ }
$('#btn-theme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* ignore */ }
});
const shell = $('#shell');
function setView(v) {
  shell.dataset.view = v;
  $('#tab-inputs').setAttribute('aria-pressed', String(v === 'inputs'));
  $('#tab-results').setAttribute('aria-pressed', String(v === 'results'));
  if (v === 'results') requestAnimationFrame(renderResults);
}
$('#tab-inputs').addEventListener('click', () => setView('inputs'));
$('#tab-results').addEventListener('click', () => setView('results'));
const syncNote = () => { $('#sample-note').hidden = !S.sample; };
$('#btn-dismiss-sample').addEventListener('click', () => { S.sample = false; save(); syncNote(); });
function replaceState(next) { S = next; ui.open = S.options[0].id; syncNote(); refresh(); }
$('#btn-sample').addEventListener('click', () => replaceState(sampleState()));
(function () {
  const b = $('#btn-clear'); let armed = false, t = 0;
  b.addEventListener('click', () => {
    if (!armed) { armed = true; b.textContent = 'Click again to clear'; t = setTimeout(() => { armed = false; b.textContent = 'Clear'; }, 3500); return; }
    clearTimeout(t); armed = false; b.textContent = 'Clear'; replaceState(blankState());
  });
})();
let rt = 0, lastW = innerWidth;
window.addEventListener('resize', () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rt); rt = setTimeout(() => { if (resultsEl.offsetParent !== null) renderResults(); }, 120); });

syncNote(); renderInputs(); renderResults(); updateSummaries();
window.RentalEvaluator = { compute, evaluate, normalize, sampleState, get state() { return S; } };
})();
</script>
</body>
</html>
